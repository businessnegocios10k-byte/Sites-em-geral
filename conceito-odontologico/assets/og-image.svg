      <stop offset="0%" stop-color="#06302F"/>
      <stop offset="55%" stop-color="#0A403D"/>
      <stop offset="100%" stop-color="#0C524E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6FB3AA" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6FB3AA" stop-opacity="0"/>
